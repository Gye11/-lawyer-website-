      <svg viewBox="0 0 200 200" class="logo">

        <path class="draw" d="M100 40 L100 140" />

        <!-- TABAN -->

        <!-- ÜST YATAY -->

        <!-- SOL TERAZİ -->

        <!-- SAĞ TERAZİ -->

        <!-- SOL ASKI -->
        <line class="draw" x1="70" y1="80" x2="70" y2="95" />

        <!-- SAĞ ASKI -->
        <line class="draw" x1="130" y1="80" x2="130" y2="95" />

        <!-- ÜST SÜS -->
        <circle class="draw" cx="100" cy="30" r="8" />

    <script src="./src/app.js"></script>

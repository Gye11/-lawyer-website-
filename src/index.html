<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>Law Intro</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- INTRO -->
    <div class="intro">
      <svg viewBox="0 0 300 300">
        <defs>
          <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f5d27a" />
            <stop offset="50%" stop-color="#D4AF37" />
            <stop offset="100%" stop-color="#a67c00" />
          </linearGradient>
        </defs>

        <!-- Çember -->
        <circle class="circle" cx="150" cy="150" r="110" />

        <!-- Logo -->
        <g class="logo">
          <path d="M80 120 Q150 90 220 120" class="stroke" />
          <line x1="150" y1="90" x2="150" y2="210" class="stroke" />

          <line x1="110" y1="120" x2="100" y2="160" class="thin" />
          <line x1="110" y1="120" x2="120" y2="160" class="thin" />

          <line x1="190" y1="120" x2="180" y2="160" class="thin" />
          <line x1="190" y1="120" x2="200" y2="160" class="thin" />

          <ellipse cx="110" cy="170" rx="25" ry="8" class="fill" />
          <ellipse cx="190" cy="170" rx="25" ry="8" class="fill" />

          <rect x="120" y="210" width="60" height="8" class="fill" />
          <rect x="110" y="225" width="80" height="6" class="fill" />
        </g>
      </svg>
    </div>
  </body>
</html>

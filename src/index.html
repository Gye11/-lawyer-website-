<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lawyer</title>

    <style>
      body {
        margin: 0;
        background: #050505;
        font-family: Arial, sans-serif;
      }

      /* INTRO */
      #intro {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle at center, #111, #000);
      }

      /* LOGO WRAP */
      .logo-wrap {
        opacity: 0;
        transform: scale(0.8);
        animation: introFade 1.8s ease forwards;
      }

      /* LOGO */
      .logo {
        width: 200px;
        filter: drop-shadow(0 0 12px rgba(212, 175, 55, 0.5))
          drop-shadow(0 0 40px rgba(212, 175, 55, 0.25));
      }

      /* ANIMATION */
      @keyframes introFade {
        0% {
          opacity: 0;
          transform: scale(0.7);
        }
        60% {
          opacity: 1;
          transform: scale(1.05);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
  </head>

  <body>
    <div id="intro">
      <div class="logo-wrap">
        <svg viewBox="0 0 200 200" class="logo">
          <defs>
            <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#8c6b1f" />
              <stop offset="50%" stop-color="#d4af37" />
              <stop offset="100%" stop-color="#fff2a8" />
            </linearGradient>
          </defs>

          <g
            stroke="url(#gold)"
            stroke-width="3"
            fill="none"
            stroke-linecap="round"
          >
            <!-- Üst -->
            <line x1="50" y1="70" x2="150" y2="70" />

            <!-- Direk -->
            <line x1="100" y1="40" x2="100" y2="150" />

            <!-- Taban -->
            <line x1="70" y1="150" x2="130" y2="150" />

            <!-- Sol -->
            <line x1="70" y1="70" x2="55" y2="110" />
            <line x1="70" y1="70" x2="85" y2="110" />

            <!-- Sağ -->
            <line x1="130" y1="70" x2="115" y2="110" />
            <line x1="130" y1="70" x2="145" y2="110" />

            <!-- Kaseler -->
            <path d="M45 110 Q70 130 95 110" />
            <path d="M105 110 Q130 130 155 110" />
          </g>
        </svg>
      </div>
    </div>
  </body>
</html>

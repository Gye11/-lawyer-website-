<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      body {
        margin: 0;
        background: #0a0a0a;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      /* LOGO */
      .logo {
        width: 180px;
      }

      /* MODERN STROKE */
      .logo path {
        stroke: #d4af37;
        stroke-width: 3;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* premium glow */
      .logo {
        filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.25));
      }

      /* hover ultra smooth */
      .logo:hover {
        transform: scale(1.08);
        transition: 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
      }
    </style>
  </head>

  <body>
    <svg viewBox="0 0 200 200" class="logo">
      <!-- minimalist üst çizgi -->
      <path d="M50 70 L150 70" />

      <!-- ince merkez -->
      <path d="M100 45 L100 140" />

      <!-- modern taban -->
      <path d="M80 140 Q100 155 120 140" />

      <!-- SOL minimal kase -->
      <path d="M60 70 L50 105 L70 105 Z" />

      <!-- SAĞ minimal kase -->
      <path d="M140 70 L130 105 L150 105 Z" />
    </svg>
  </body>
</html>
